<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Paper Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: url('images/image1.jpg.jpg') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
        }
        .header {
            width:100%;
            height:100px;
            background: rgba(0, 40, 85, 0.9);
            color: rgba(152, 131, 140, 0.782);
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header img{
            border-radius:50%;
            height:100px;
            width:100px;
        }
        .logo {
            height: 50px;
            margin-right: 15px;
        }
       
        .container {
             max-width: 900px;
            margin: 100px auto 20px;
            padding: 20px;
            background: rgba(40, 40, 181, 0.166);
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .title {
            font-size: 30px;
            background-color: #d4d5cc44;
            color: rgb(34, 57, 86);
            width:100%;
            height:50px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .option {
            padding: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            background-color: #cad0d710;
            color: rgb(2, 26, 5);
            border-radius: 5px;
            font-weight: bold;
            transition:all 2s ease-in-out;
        }
        button:hover {
            background-color: #0056b3;
        }
        .generate-btn {
            margin-top: 30px;
            width: 50%;
            padding: 15px;
            font-size: 18px;
            background-color: #28a745;
            transition: 0.3s;
        }
        .generate-btn:hover {
            background-color: #218838;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 10px;
            padding-left: 10px;
        }
        .radio-group label {
            display: block;
            margin-bottom: 5px;
            font-size:20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="image7.jpg.jpg" alt="College Logo" class="logo">
        GURU NANAK COLLEGE (AUTONOMOUS)
    </div>
    
    <div class="container">
        <h2 class="title">Automatic Question Paper Generator</h2>
        <div class="grid-container">
            <div class="option">
                <button onclick="toggleOptions('stream-options')">Stream</button>
                <div id="stream-options" class="radio-group"></div>
            </div>

            <div class="option">
                <button onclick="toggleOptions('department-options')">Department</button>
                <div id="department-options" class="radio-group"></div>
            </div>

            <div class="option">
                <button onclick="toggleOptions('subject-options')">Subjects</button>
                <div id="subject-options" class="radio-group"></div>
            </div>

            <div class="option">
                <button onclick="toggleOptions('exam-options')">Exam Type</button>
                <div id="exam-options" class="radio-group"></div>
            </div>

            <div class="option">
                <button onclick="toggleOptions('marks-options')">Marks</button>
                <div id="marks-options" class="radio-group"></div>
            </div>

            <div class="option">
                <button onclick="toggleOptions('year-options')">Year</button>
                <div id="year-options" class="radio-group"></div>
            </div>
        </div>
        <button class="generate-btn" onclick="generateQuestionPaper()">Generate Question Paper</button>
    </div>
    
    <script src="index.js">   
    </script>
</body>
</html>
