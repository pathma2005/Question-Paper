<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Paper Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            text-align: left;
        }
        h2, h3 {
            text-align: center;
        }
        .question {
            margin-bottom: 10px;
            font-size: 16px;
            opacity: 0; /* Initially hidden */
            animation: fadeIn 0.5s forwards; /* Fade-in animation */
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        .generate-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            position: fixed; /* Fixed position at the bottom */
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .generate-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GURU NANAK COLLEGE (AUTONOMOUS), CHENNAI-42</h2>
        <h3>MODEL EXAMINATION (2025)</h3>
        <p><strong>Subject:</strong> Design and Analysis of Algorithms</p>
        <p><strong>Max Marks:</strong> 100</p>
        <p><strong>Time:</strong> 3 Hour</p>

        <!-- Sections for dynamically generated questions -->
        <div id="section-a"></div>
        <div id="section-b"></div>
        <div id="section-c"></div>
    </div>

    <!-- Generate Button at the Bottom -->
    <button class="generate-btn" onclick="generateQuestionPaper()">Generate Question Paper</button>

    <script src="dashboard100.js">
    </script>
</body>
</html>
